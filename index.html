<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>🥊 Fight Pool — Live Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0f; --panel:#14141c; --panel2:#1b1b26; --line:#2a2a3a;
    --ink:#f3f4f8; --muted:#9aa0b4;
    --red:#ff3b3b; --red2:#c81e2b; --gold:#ffce46; --green:#37e08b; --blue:#4aa3ff;
    --disp:"Bebas Neue",Impact,system-ui,sans-serif;
    --body:"Inter",system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:
      radial-gradient(1200px 500px at 50% -10%, rgba(255,59,59,.16), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(255,206,70,.10), transparent 55%),
      var(--bg);
    color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:680px;margin:0 auto;padding:16px 14px 60px}
  a{color:var(--gold)}

  /* header */
  .hero{text-align:center;padding:10px 6px 6px;position:relative}
  .belt{display:inline-block;font-family:var(--disp);letter-spacing:2px;font-size:13px;
    color:#20180a;background:linear-gradient(90deg,#ffce46,#ffe9a8,#ffce46);
    padding:3px 14px;border-radius:999px;transform:rotate(-1.5deg);box-shadow:0 4px 14px rgba(255,206,70,.35)}
  h1{font-family:var(--disp);font-weight:400;letter-spacing:1.5px;line-height:.95;margin:10px 0 4px;
    font-size:clamp(34px,10vw,58px);
    background:linear-gradient(180deg,#fff, #ffd9a0 60%, #ff8a3b);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 30px rgba(255,120,60,.25)}
  .tagline{color:var(--muted);font-size:14px;font-style:italic;margin:2px 0 12px;min-height:20px}
  .statusbar{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  .live{display:inline-flex;align-items:center;gap:6px;background:#14351f;color:#57e08a;border:1px solid #1e5c37;
    border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800;letter-spacing:.5px}
  .dot{width:8px;height:8px;border-radius:50%;background:#57e08a;box-shadow:0 0 10px #57e08a;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
  .updated{color:var(--muted);font-size:12px}
  .btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
    padding:8px 13px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:700;font-family:var(--body)}
  .btn:active{transform:scale(.97)}

  /* lock banner */
  .lock{margin:12px 0;padding:12px 14px;border-radius:14px;text-align:center;
    background:linear-gradient(90deg,rgba(255,59,59,.16),rgba(255,206,70,.14));
    border:1px solid #3a2a2a}
  .lock .big{font-family:var(--disp);font-size:26px;letter-spacing:1px;color:#fff}
  .lock .cd{font-family:var(--mono);font-weight:800;color:var(--gold)}
  .lock a.cta{display:inline-block;margin-top:8px;background:linear-gradient(90deg,var(--red),var(--red2));
    color:#fff;text-decoration:none;font-weight:800;padding:9px 18px;border-radius:10px;
    box-shadow:0 6px 18px rgba(255,59,59,.35)}
  .lock.locked{background:linear-gradient(90deg,rgba(120,120,140,.12),rgba(120,120,140,.06));border-color:#33333f}

  /* kpi */
  .kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
  .kpi .box{background:linear-gradient(180deg,var(--panel),#101018);border:1px solid var(--line);
    border-radius:14px;padding:12px 14px;position:relative;overflow:hidden}
  .kpi .box::after{content:"";position:absolute;inset:0;background:radial-gradient(120px 60px at 100% 0,rgba(255,206,70,.10),transparent)}
  .kpi .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:800}
  .kpi .val{font-family:var(--disp);font-size:30px;letter-spacing:1px;margin-top:2px;color:#fff}

  h2.sec{font-family:var(--disp);letter-spacing:1.5px;font-size:24px;margin:22px 0 12px;color:#fff;
    display:flex;align-items:center;gap:8px}
  h2.sec .em{font-size:20px}

  /* leaderboard */
  .board{display:flex;flex-direction:column;gap:9px}
  .row{display:flex;flex-direction:column;gap:7px;background:linear-gradient(180deg,var(--panel),#101018);
    border:1px solid var(--line);border-radius:14px;padding:11px 13px}
  .row .line1{display:flex;align-items:center;gap:10px}
  .row .rank{font-family:var(--disp);font-size:26px;width:34px;text-align:center;color:var(--muted);flex:none}
  .row .who{flex:1;min-width:0;font-weight:800;font-size:17px;display:flex;align-items:center;gap:7px}
  .row .who .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .pts{font-family:var(--mono);font-weight:800;font-size:19px;color:#fff;flex:none}
  .row .barwrap{height:9px;background:#0c0c14;border-radius:6px;overflow:hidden}
  .row .bar{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),#7bc0ff);transition:width .7s cubic-bezier(.2,.8,.2,1)}
  .row .quip{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.2px}
  .row.p1 .quip{color:var(--gold)}
  .row.p1{border-color:#7a5a12;background:linear-gradient(180deg,#241d0a,#14100a);box-shadow:0 8px 26px rgba(255,206,70,.14)}
  .row.p1 .rank,.row.p1 .who{color:var(--gold)}
  .row.p1 .bar{background:linear-gradient(90deg,#ffce46,#ffe9a8)}
  .row.p2 .bar{background:linear-gradient(90deg,#c7d0da,#eef2f7)}
  .row.p3 .bar{background:linear-gradient(90deg,#cd8b52,#e6b184)}
  .crown{filter:drop-shadow(0 0 6px rgba(255,206,70,.6))}

  /* fight cards */
  .fights{display:flex;flex-direction:column;gap:12px}
  .fc{background:linear-gradient(180deg,var(--panel),#101018);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .fc .top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line)}
  .fc .match{font-family:var(--disp);font-size:19px;letter-spacing:.6px;color:#fff}
  .fc .rds{font-size:10px;font-weight:800;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:middle}
  .fc .res{font-size:12px;font-weight:800;font-family:var(--mono);white-space:nowrap}
  .fc .res.tbd{color:var(--muted)}
  .fc .res.done{color:var(--gold)}
  .sides{display:grid;grid-template-columns:1fr 1fr}
  .side{padding:10px 12px}
  .side+.side{border-left:1px solid var(--line)}
  .side .fname{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .side .mult{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .side.win .fname{color:var(--green)}
  .side.lose{opacity:.55}
  .side .chips{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px}
  .chip{font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-weight:600}
  .chip.hit{background:#0f2c1c;border-color:#1e5c37;color:#8ff0b6}
  .chip .p{font-family:var(--mono);font-size:10px;color:#57e08a;margin-left:4px}
  .side .none{font-size:11px;color:var(--muted);opacity:.6;margin-top:7px}
  .beltwin{font-size:11px}

  /* picks grid (the slips) */
  .gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:14px;
    background:linear-gradient(180deg,var(--panel),#101018)}
  table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
  table.grid th,table.grid td{padding:7px 9px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
  table.grid thead th{position:sticky;top:0;background:#181822;color:var(--muted);font-weight:800;
    font-size:13px;font-family:var(--disp);letter-spacing:.5px;z-index:2}
  table.grid thead th .fsub{display:block;font-size:9px;font-weight:600;font-family:var(--body);color:#7b8196;letter-spacing:0;margin-top:1px}
  table.grid th.pcorner,table.grid td.pname{position:sticky;left:0;background:#181822;text-align:left;
    font-weight:800;color:var(--ink);z-index:1;border-right:1px solid var(--line)}
  table.grid thead th.pcorner{z-index:3}
  table.grid td.cell{color:var(--ink)}
  table.grid td.hit{color:#8ff0b6;font-weight:800;background:#0f2c1c}
  table.grid td.hit .cpts{display:block;font-family:var(--mono);font-size:9px;color:#57e08a;font-weight:700}
  table.grid td.miss{color:#ff8080;font-weight:700;background:#2c1010;text-decoration:line-through;text-decoration-color:rgba(255,128,128,.55)}
  table.grid td .mk{font-weight:800;margin-right:2px}
  table.grid td.empty{color:var(--muted);opacity:.4}
  table.grid tbody tr:last-child td{border-bottom:none}
  .gridnote{color:var(--muted);font-size:11px;text-align:center;margin:8px 2px 0}

  /* ringside announcer */
  .announcer{margin:14px 0 2px;padding:12px 14px;border-radius:14px;
    background:linear-gradient(90deg,rgba(255,59,59,.13),rgba(255,206,70,.10));border:1px solid #3a2a2a}
  .announcer .onair{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);
    letter-spacing:1.5px;font-size:12px;color:#ff8a8a;margin-bottom:5px}
  .announcer .onair .rd{width:8px;height:8px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 8px #ff3b3b;animation:pulse 1.4s infinite}
  .announcer .say{font-size:14px;line-height:1.5;color:var(--ink)}
  .announcer .say b{color:#fff}

  /* cooler of the night */
  .cooler{margin:12px 0;padding:11px 14px;border-radius:14px;text-align:center;
    background:linear-gradient(90deg,rgba(74,163,255,.16),rgba(255,59,59,.10));border:1px solid #2a3550}
  .cooler .lab{font-family:var(--disp);letter-spacing:1.5px;font-size:16px;color:#9fc3ff}
  .cooler .who{font-weight:800;color:#fff;font-size:15px;margin-top:1px}
  .cooler .ins{display:block;font-size:12px;color:var(--muted);margin-top:1px;font-style:italic}

  /* live cage feed */
  .feed{display:flex;flex-direction:column;gap:8px}
  .feed .fi{background:linear-gradient(180deg,var(--panel),#101018);border:1px solid var(--line);
    border-radius:12px;padding:9px 12px;font-size:13px;line-height:1.4}
  .feed .fi.up{border-color:#7a5a12;background:linear-gradient(180deg,#221b0a,#12100a)}
  .feed .none{color:var(--muted);font-size:12px;text-align:center;padding:12px}

  /* confetti on lead change */
  .confetti{position:fixed;top:-16px;width:9px;height:15px;z-index:9999;pointer-events:none;
    border-radius:2px;animation:cfall linear forwards}
  @keyframes cfall{to{transform:translateY(110vh) rotate(760deg);opacity:.85}}

  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:26px;line-height:1.6}
  .err{background:#3a1c1c;border:1px solid #6b2b2b;color:#f0b4b4;padding:12px 14px;border-radius:12px;margin:12px 0;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <span class="belt">🏆 UNDISPUTED FIGHT POOL 🏆</span>
    <h1 id="eventName">Fight Pool</h1>
    <div class="tagline" id="tagline">&nbsp;</div>
    <div class="statusbar">
      <span class="live"><span class="dot"></span> LIVE</span>
      <span class="updated" id="updated">—</span>
      <button class="btn" id="refresh">↻ Refresh</button>
    </div>
  </div>

  <div class="lock" id="lock" style="display:none"></div>
  <div class="err" id="err"></div>

  <div class="kpi" id="kpi"></div>
  <div class="cooler" id="cooler" style="display:none"></div>

  <div class="announcer" id="announcer"></div>

  <h2 class="sec"><span class="em">👑</span> THE PECKING ORDER</h2>
  <div class="board" id="boardBody"></div>

  <h2 class="sec"><span class="em">📢</span> LIVE FROM THE CAGE</h2>
  <div class="feed" id="feed"></div>

  <h2 class="sec"><span class="em">🥊</span> TALE OF THE TAPE</h2>
  <div class="fights" id="fights"></div>

  <h2 class="sec"><span class="em">📋</span> THE SLIPS</h2>
  <div id="picksGrid"></div>

  <div class="foot" id="foot">
    Live results yanked straight off ESPN · scoring is odds-weighted (underdogs pay, early finishes pay more)<br>
    May the best degenerate win. 🫡
  </div>
</div>

<script>
"use strict";
let CONFIG=null, RESULTS=null;

/* ===== scoring (verified vs spreadsheet — do not change) ===== */
function impliedProb(ml){ml=Number(ml);if(isNaN(ml))return null;if(ml===0)return 0.5;return ml>0?100/(ml+100):(-ml)/((-ml)+100);}
function multiplier(ml){const p=impliedProb(ml);if(p===null||p===0)return 0;return 1/(2*p);}
function winnerML(fi){const r=RESULTS.fights[fi];if(!r||!r.w)return null;return r.w==="a"?CONFIG.fights[fi].mlA:CONFIG.fights[fi].mlB;}
function winPointsFor(fi){const ml=winnerML(fi);if(ml===null)return 0;return multiplier(ml)*Number(CONFIG.winMode||1);}
function schedRounds(fi){const r=RESULTS.fights[fi]&&RESULTS.fights[fi].rounds;const c=CONFIG.fights[fi]&&CONFIG.fights[fi].rounds;return Number(r||c)===5?5:3;}
function bonusPoints(round,N,maxBonus){if(round==="DEC")return 0;const r=Number(round);if(!r||r<1)return 0;const rr=Math.min(r,N);return maxBonus*(N-rr+1)/N;}
function bonusFor(fi){const r=RESULTS.fights[fi];if(!r||!r.w)return 0;const mode=CONFIG.bonusMode||"weighted";if(mode==="off")return 0;const N=schedRounds(fi);const pts=bonusPoints(r.r,N,Number(CONFIG.maxBonus!=null?CONFIG.maxBonus:3));if(mode==="flat")return pts;return pts*multiplier(winnerML(fi));}
function cellPoints(pi,fi){const r=RESULTS.fights[fi];if(!r||!r.w)return 0;const pick=CONFIG.picks[pi]&&CONFIG.picks[pi][fi];if(!pick||pick!==r.w)return 0;return winPointsFor(fi)+bonusFor(fi);}
function playerTotal(pi){let t=0;CONFIG.fights.forEach((_,fi)=>{t+=cellPoints(pi,fi);});return t;}
function fmt2(n){return (Math.round(n*100)/100).toFixed(2);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function medal(r){return r===1?"🥇":r===2?"🥈":r===3?"🥉":r;}

/* ===== flavor ===== */
const TAGLINES=[
  "Where confidence goes to get knocked out.",
  "10 experts. 1 winner. 9 excuses.",
  "Picking favorites is for cowards. 💰",
  "Somebody's about to talk a lot of trash.",
  "Chalk is for losers and sidewalks.",
  "The odds don't care about your feelings.",
  "Styles make fights. Bad picks make group chats.",
  "No refunds on bad beats.",
  "Fortune favors the degenerate.",
  "Everyone's a genius until the cage door shuts."
];
// 10-tier trash-talk ladder, rank 1 (belt) down to rank 10 (dogshit)
const RANK_TITLES=[
  "👑 Undisputed Champ",
  "🥊 #1 Contender",
  "🎯 Smells the Belt",
  "🔪 Stone-Cold Killer",
  "😤 Sweating Through the Shirt",
  "😐 Aggressively Mid",
  "🪣 Bucket Boy",
  "🧦 Roster Filler",
  "🚑 Somebody Call a Doctor",
  "🤡 You're Dogshit"
];
function rankTitle(rank,pts){
  if(pts<=0) return "🧊 Stone Cold Zero";        // scoring started, still winless
  return RANK_TITLES[Math.min(Math.max(rank,1),10)-1] || "";
}
// Cooler-of-the-night insults (rotates through the night)
const COOLER_LINES=[
  "a truly historic collapse.",
  "currently buying everyone's beer.",
  "aggressively bad at this.",
  "should've just picked chalk.",
  "the reason we play for money.",
  "getting lapped by a coin flip.",
  "please clap. 🫠"
];
function methodVerb(r){
  const m=(r.method||"").toLowerCase();
  if(/sub/.test(m)) return "taps out";
  if(/ko/.test(m)) return "starches";
  return "outpoints";
}
// ringside announcer — live trash-talk breakdown driven by current standings + results
function announce(arr,scored,total){
  if(!arr.length) return "";
  const leader=arr[0], last=arr[arr.length-1];
  const remaining=total-scored;
  const lt=lockTime(); const locked=CONFIG.locked||(lt&&new Date()>=lt);
  if(scored===0){
    return locked
      ? `Gloves are laced and the picks are <b>LOCKED</b> — no takebacks now. ${total} fights, ${arr.length} bozos, one belt. Nine of you are about to be very, very wrong. 🥊`
      : `Picks are still trickling in. Get 'em locked before the cage door slams — chalk-huggers and lunatics alike.`;
  }
  const tiedTop=arr.filter(a=>Math.abs(a.pts-leader.pts)<1e-9);
  if(remaining===0){
    const champLine = tiedTop.length>1
      ? `We've got CO-CHAMPS?! ${tiedTop.map(a=>esc(a.n)).join(" & ")} split the belt at ${fmt2(leader.pts)}.`
      : `Your undisputed champ: <b>${esc(leader.n)}</b> at ${fmt2(leader.pts)}.`;
    return `THAT'S THE CARD. ${champLine} ${esc(last.n)} leaves with nothing but shame (${fmt2(last.pts)}). Pay up, bozos. 🏆`;
  }
  let s=`<b>${scored}</b> in the books, <b>${remaining}</b> to go. `;
  if(tiedTop.length>1){
    s+=`Logjam up top — ${tiedTop.map(a=>esc(a.n)).join(" & ")} deadlocked at ${fmt2(leader.pts)}. Somebody land a haymaker. `;
  }else{
    const gap=leader.pts-arr[1].pts;
    s+=`<b>${esc(leader.n)}</b> is running the show at ${fmt2(leader.pts)}${gap>=3?`, a comfy ${fmt2(gap)} clear of the pack`:` with ${esc(arr[1].n)} breathing down his neck (${fmt2(arr[1].pts)})`}. `;
  }
  s+= last.pts<=0 ? `Down at the bottom, ${esc(last.n)} still hasn't landed a thing — woof. 🐕` : `Meanwhile ${esc(last.n)} is faceplanting at ${fmt2(last.pts)}.`;
  return s;
}
// confetti burst when the lead changes hands
let prevLeader=null;
function confettiBurst(){
  const colors=["#ffce46","#ff3b3b","#37e08b","#4aa3ff","#ffffff"];
  for(let i=0;i<44;i++){
    const d=document.createElement("div"); d.className="confetti";
    d.style.left=(Math.random()*100)+"vw";
    d.style.background=colors[i%colors.length];
    d.style.animationDuration=(1.5+Math.random()*1.6)+"s";
    d.style.transform="rotate("+(Math.random()*360)+"deg)";
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),3400);
  }
}

function standings(){
  const arr=CONFIG.players.map((n,i)=>({i,n,pts:playerTotal(i)}));
  arr.sort((a,b)=>b.pts-a.pts);
  let rank=0,last=null,seen=0;
  arr.forEach(o=>{seen++;if(last===null||o.pts<last-1e-9){rank=seen;last=o.pts;}o.rank=rank;});
  return arr;
}

/* ===== lock countdown ===== */
function lockTime(){ return CONFIG.lockISO ? new Date(CONFIG.lockISO) : null; }
function renderLock(){
  const el=document.getElementById("lock");
  const t=lockTime();
  const now=new Date();
  const formUrl=CONFIG.formUrl||"";
  if(CONFIG.locked || (t && now>=t)){
    el.style.display="block";
    el.className="lock locked";
    el.innerHTML=`<div class="big">🔒 PICKS ARE LOCKED</div><div style="color:var(--muted);font-size:13px;margin-top:2px">No takebacks. Live and die by 'em.</div>`;
    return;
  }
  if(!t){ el.style.display="none"; return; }
  el.style.display="block";
  let ms=t-now, s=Math.floor(ms/1000);
  const d=Math.floor(s/86400); s-=d*86400;
  const h=Math.floor(s/3600); s-=h*3600;
  const m=Math.floor(s/60); s-=m*60;
  const cd=(d?d+"d ":"")+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  el.className="lock";
  el.innerHTML=`<div class="big">⏳ PICKS LOCK IN</div><div class="cd" style="font-size:22px;margin:4px 0">${cd}</div>`+
    (formUrl?`<a class="cta" href="${esc(formUrl)}" target="_blank" rel="noopener">🥊 MAKE YOUR PICKS</a>`:
     `<div style="color:var(--muted);font-size:12px">pick form drops soon</div>`);
}

function render(){
  document.getElementById("eventName").textContent=CONFIG.event||"Fight Pool";
  const tagEl=document.getElementById("tagline");
  if(tagEl.dataset.set!=="1"){ tagEl.textContent=TAGLINES[Math.floor(Math.random()*TAGLINES.length)]; tagEl.dataset.set="1"; }

  const arr=standings();
  const max=Math.max(1,...arr.map(a=>a.pts));
  const scored=CONFIG.fights.filter((_,fi)=>{const r=RESULTS.fights[fi];return r&&(r.w||r.done);}).length;
  const anyPts=arr.some(a=>a.pts>0);
  let leaderLab="Leader", leaderVal="TBD, chumps";
  if(anyPts){
    const top=arr[0].pts;
    const tied=arr.filter(a=>Math.abs(a.pts-top)<1e-9);
    if(tied.length>1){ leaderLab="Leaders"; leaderVal="Logjam ("+tied.length+")"; }
    else { leaderLab="Current champ"; leaderVal=esc(arr[0].n); }
  }
  document.getElementById("kpi").innerHTML=`
    <div class="box"><div class="lab">Bozos</div><div class="val">${CONFIG.players.length}</div></div>
    <div class="box"><div class="lab">Fights in the books</div><div class="val">${scored}/${CONFIG.fights.length}</div></div>
    <div class="box"><div class="lab">${leaderLab}</div><div class="val">${leaderVal}</div></div>
    <div class="box"><div class="lab">Top score</div><div class="val">${arr[0]?fmt2(arr[0].pts):"0"}</div></div>`;

  document.getElementById("boardBody").innerHTML=arr.map(o=>{
    const cls=anyPts?(o.rank===1?"p1":o.rank===2?"p2":o.rank===3?"p3":""):"";
    const w=Math.max(3,(o.pts/max)*100);
    const crown=anyPts&&o.rank===1&&o.pts>0?'<span class="crown">👑</span>':"";
    const q=anyPts?rankTitle(o.rank,o.pts):"";
    const rankDisp=anyPts?medal(o.rank):o.rank;
    return `<div class="row ${cls}">
      <div class="line1">
        <div class="rank">${rankDisp}</div>
        <div class="who">${crown}<span class="name">${esc(o.n)}</span></div>
        <div class="pts">${fmt2(o.pts)}</div>
      </div>
      <div class="barwrap"><div class="bar" style="width:${w}%"></div></div>
      ${q?`<div class="quip">${q}</div>`:""}
    </div>`;
  }).join("");

  // ringside announcer (updates every refresh as fights resolve)
  document.getElementById("announcer").innerHTML=
    `<div class="onair"><span class="rd"></span> 🎙️ RINGSIDE MIC</div><div class="say">${announce(arr,scored,CONFIG.fights.length)}</div>`;

  // cooler of the night (worst active player)
  const coolerEl=document.getElementById("cooler");
  if(anyPts && arr.length){
    const loser=arr[arr.length-1];
    coolerEl.style.display="block";
    coolerEl.innerHTML=`<div class="lab">🧊 COOLER OF THE NIGHT</div><div class="who">${esc(loser.n)} — ${fmt2(loser.pts)}</div><span class="ins">${COOLER_LINES[scored%COOLER_LINES.length]}</span>`;
  } else { coolerEl.style.display="none"; }

  // live-from-the-cage feed (one punchy line per resolved fight)
  const resolved=CONFIG.fights.map((f,fi)=>({f,fi,r:RESULTS.fights[fi]})).filter(x=>x.r&&(x.r.w||x.r.done));
  const feedEl=document.getElementById("feed");
  if(!resolved.length){
    feedEl.innerHTML=`<div class="none">No results yet — first bell hasn't rung. 🔔</div>`;
  } else {
    feedEl.innerHTML=resolved.map(({f,fi,r})=>{
      if(r.done&&!r.w) return `<div class="fi">🤝 <b>${esc(f.a)}</b> vs <b>${esc(f.b)}</b> — DRAW. Everyone who bet it eats a zero.</div>`;
      const wname=r.w==="a"?f.a:f.b, lname=r.w==="a"?f.b:f.a;
      const wml=r.w==="a"?f.mlA:f.mlB, upset=Number(wml)>0;
      let nC=0,nW=0; CONFIG.players.forEach((p,pi)=>{const pk=CONFIG.picks[pi]&&CONFIG.picks[pi][fi]; if(!pk)return; pk===r.w?nC++:nW++;});
      const rd=r.r&&r.r!=="DEC"?` in R${r.r}`:" by decision";
      return `<div class="fi ${upset?'up':''}">${upset?'🚨 <b>UPSET:</b> ':'✅ '}${esc(wname)} ${methodVerb(r)} ${esc(lname)}${rd}. <b>${nC}</b> nailed it, <b>${nW}</b> got cooked.</div>`;
    }).join("");
  }

  // confetti when the lead changes hands
  if(anyPts && arr.length){
    const lead=arr[0].n;
    if(prevLeader!==null && prevLeader!==lead) confettiBurst();
    prevLeader=lead;
  }

  // fight cards
  document.getElementById("fights").innerHTML=CONFIG.fights.map((f,fi)=>{
    const r=RESULTS.fights[fi]||{};
    const N=schedRounds(fi);
    const ma=multiplier(f.mlA), mb=multiplier(f.mlB);
    const pickersA=[], pickersB=[];
    CONFIG.players.forEach((n,pi)=>{
      const pick=CONFIG.picks[pi]&&CONFIG.picks[pi][fi];
      if(pick==="a") pickersA.push(pi);
      else if(pick==="b") pickersB.push(pi);
    });
    const chip=(pi,side)=>{
      const correct=r.w&&r.w===side;
      const pts=correct?cellPoints(pi,fi):0;
      return `<span class="chip ${correct?'hit':''}">${esc(CONFIG.players[pi])}${correct?`<span class="p">+${fmt2(pts)}</span>`:""}</span>`;
    };
    const sideHTML=(f,ml,mult,side,pickers)=>{
      const win=r.w&&r.w===side, lose=r.w&&r.w!==side;
      const belt=win?' <span class="beltwin">🏆</span>':"";
      return `<div class="side ${win?'win':''} ${lose?'lose':''}">
        <div class="fname">${esc(side==='a'?f.a:f.b)}${belt}</div>
        <div class="mult">${mult?('×'+fmt2(mult)):''}${(side==='a'?f.mlA:f.mlB)!=null?` · ${(side==='a'?f.mlA:f.mlB)>0?'+':''}${(side==='a'?f.mlA:f.mlB)}`:''}</div>
        ${pickers.length?`<div class="chips">${pickers.map(pi=>chip(pi,side)).join("")}</div>`:`<div class="none">nobody 😬</div>`}
      </div>`;
    };
    let res;
    if(r.done&&!r.w){ const m=r.method&&/draw|no contest/i.test(r.method)?esc(r.method):"Draw"; res=`<span class="res done">🤝 ${m}</span>`; }
    else if(!r.w){ res=`<span class="res tbd">⏳ TBD</span>`; }
    else{ const wn=r.w==="a"?f.a:f.b; const rd=r.r&&r.r!=="DEC"?`R${r.r}`:"DEC"; const meth=r.method?` ${esc(r.method)}`:""; res=`<span class="res done">✅ ${esc(wn)} · ${rd}${meth}</span>`; }
    return `<div class="fc">
      <div class="top"><div class="match">${esc(f.a)} <span style="color:var(--muted)">vs</span> ${esc(f.b)}<span class="rds">${N}R</span></div>${res}</div>
      <div class="sides">${sideHTML(f,f.mlA,ma,'a',pickersA)}${sideHTML(f,f.mlB,mb,'b',pickersB)}</div>
    </div>`;
  }).join("");

  // ===== the slips: everyone's picks grid =====
  const gridEl=document.getElementById("picksGrid");
  const lastName=full=>{const p=String(full||"").trim().split(/\s+/);return p[p.length-1]||"—";};
  const anyPicks=CONFIG.players.some((_,pi)=>CONFIG.picks[pi]&&Object.keys(CONFIG.picks[pi]).length);
  if(!anyPicks){
    gridEl.innerHTML=`<div class="gridnote" style="padding:18px 12px;font-size:13px">📋 Everyone's slips drop in here the second picks lock — 5:00 PM ET. 🔒</div>`;
  }else{
    const head=`<th class="pcorner">Player</th>`+CONFIG.fights.map((f,fi)=>
      `<th>${fi+1}<span class="fsub">${esc(lastName(f.a))}/${esc(lastName(f.b))}</span></th>`).join("");
    const body=arr.map(o=>{
      const pi=o.i;
      const cells=CONFIG.fights.map((f,fi)=>{
        const pick=CONFIG.picks[pi]&&CONFIG.picks[pi][fi];
        if(!pick) return `<td class="empty">—</td>`;
        const nm=esc(lastName(pick==="a"?f.a:f.b));
        const r=RESULTS.fights[fi];
        if(r&&r.w){
          if(r.w===pick) return `<td class="hit"><span class="mk">✓</span>${nm}<span class="cpts">+${fmt2(cellPoints(pi,fi))}</span></td>`;
          return `<td class="miss"><span class="mk">✗</span>${nm}</td>`;
        }
        return `<td class="cell">${nm}</td>`;
      }).join("");
      return `<tr><td class="pname">${esc(o.n)}</td>${cells}</tr>`;
    }).join("");
    gridEl.innerHTML=`<div class="gridwrap"><table class="grid"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`+
      `<div class="gridnote">← scroll for all ${CONFIG.fights.length} fights · <span style="color:#8ff0b6">✓ green = nailed it</span> · <span style="color:#ff8080">✗ red = missed</span> · updates live</div>`;
  }

  const when=RESULTS.generatedAt?new Date(RESULTS.generatedAt):null;
  document.getElementById("updated").textContent=when?("Updated "+when.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})):"Awaiting first update";
  renderLock();
}

async function load(){
  try{
    const bust="?t="+Date.now();
    const [c,r]=await Promise.all([
      fetch("config.json"+bust).then(x=>{if(!x.ok)throw new Error("config.json "+x.status);return x.json();}),
      fetch("results.json"+bust).then(x=>x.ok?x.json():{generatedAt:null,fights:{}}).catch(()=>({generatedAt:null,fights:{}}))
    ]);
    CONFIG=c; RESULTS=r&&r.fights?r:{generatedAt:null,fights:{}};
    document.getElementById("err").style.display="none";
    render();
  }catch(e){
    const el=document.getElementById("err");
    el.style.display="block";
    el.textContent="Couldn't load data: "+e.message+". (If you opened this file directly, results only load when served from the web.)";
  }
}
document.getElementById("refresh").onclick=load;
load();
setInterval(load,30000);      // refresh data every 30s
setInterval(renderLock,1000); // tick the countdown every second
</script>
</body>
</html>
