name: Update fight results
on:
  schedule:
    # every 6 minutes = max 10 runs/hour, at/under GitHub Pages' 10-builds/hour soft limit.
    # (Most runs commit nothing thanks to write-only-on-change, so real rebuilds stay well under.)
    - cron: "*/6 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch ESPN results into results.json
        run: node update.mjs --no-push
      - name: Commit if changed
        run: |
          git config user.name "fight-pool-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results.json
          git commit -m "auto results update" || echo "no changes"
          git push
