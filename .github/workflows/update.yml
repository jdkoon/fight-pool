name: Update fight results
on:
  # Cron disabled during the event — GitHub throttles scheduled runs to every 20-50 min,
  # too slow for a live card. The "Live loop" workflow is the live driver tonight.
  # Kept as a manual one-shot backup (Run workflow button). Re-add the schedule after
  # the event if you want passive polling again.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fight-pool-writer
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch ESPN results into results.json
        run: node update.mjs --no-push
      - name: Commit if changed
        run: |
          git config user.name "fight-pool-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results.json
          git commit -m "auto results update" || echo "no changes"
          git push
